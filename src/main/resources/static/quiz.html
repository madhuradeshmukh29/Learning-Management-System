
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Quiz - LMS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="quiz-page">

    <header class="courses-header">
        <h1>Course Quiz</h1>
        <p>Test your knowledge and check your understanding.</p>
    </header>

    <main class="quiz-container">

        <button id="backToCourse" class="quiz-back-btn">
            Back to Course
        </button>

        <section class="quiz-card">

            <div id="quizQuestions">
                Loading questions...
            </div>

            <button id="submitQuiz">
                Submit Quiz
            </button>

            <p id="quizResult"></p>

        </section>

    </main>

    <script src="quiz.js"></script>
</body>
</html>
